{% extends 'groups/base.html' %}

{% block title %}Savolni tahrirlash{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-3xl mx-auto px-4">
        <div class="mb-6">
            <a href="{% url 'admin_question_list' %}" class="text-gray-500 hover:text-gray-700 text-sm">
                <i class="fas fa-arrow-left mr-1"></i> Savollar ro'yxatiga qaytish
            </a>
            <h1 class="text-2xl font-bold text-gray-900 mt-2">Savolni tahrirlash</h1>
            <p class="text-gray-500 text-sm">ID: {{ question.id }}</p>
        </div>

        <form method="post" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            {% csrf_token %}

            <!-- Kategoriya -->
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-2">Kategoriya</label>
                <select name="category" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if question.category.id == cat.id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Savol turi -->
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-2">Savol turi</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer {% if question.question_type == 'fill_blank' %}border-blue-500 bg-blue-50{% else %}border-gray-200{% endif %}">
                        <input type="radio" name="question_type" value="fill_blank" {% if question.question_type == 'fill_blank' %}checked{% endif %} class="mr-3">
                        <div>
                            <div class="font-medium">📝 Bo'sh joy to'ldirish</div>
                        </div>
                    </label>
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer {% if question.question_type == 'sentence_arrangement' %}border-blue-500 bg-blue-50{% else %}border-gray-200{% endif %}">
                        <input type="radio" name="question_type" value="sentence_arrangement" {% if question.question_type == 'sentence_arrangement' %}checked{% endif %} class="mr-3">
                        <div>
                            <div class="font-medium">🔀 So'zlarni tartibga solish</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Fill blank -->
            <div id="fillBlankFields" {% if question.question_type != 'fill_blank' %}style="display: none;"{% endif %}>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Savol matni</label>
                    <textarea name="question_text" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2">{{ question.question_text|default:'' }}</textarea>
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">To'g'ri javob</label>
                    <input type="text" name="correct_answer" value="{{ question.correct_answer|default:'' }}" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
            </div>

            <!-- Sentence arrangement -->
            <div id="sentenceArrangementFields" {% if question.question_type != 'sentence_arrangement' %}style="display: none;"{% endif %}>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Chalkashtirilgan so'zlar</label>
                    <textarea name="scrambled_words" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 font-mono">{{ question.scrambled_words|default:'' }}</textarea>
                </div>
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">To'g'ri gap</label>
                    <input type="text" name="correct_sentence" value="{{ question.correct_sentence|default:'' }}" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">Saqlash</button>
                <a href="{% url 'admin_question_list' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-6 py-2 rounded-lg">Bekor qilish</a>
            </div>
        </form>
    </div>
</div>

<script>
document.querySelectorAll('input[name="question_type"]').forEach(radio => {
    radio.addEventListener('change', function() {
        document.getElementById('fillBlankFields').style.display = 'none';
        document.getElementById('sentenceArrangementFields').style.display = 'none';
        
        if (this.value === 'fill_blank') {
            document.getElementById('fillBlankFields').style.display = 'block';
        } else {
            document.getElementById('sentenceArrangementFields').style.display = 'block';
        }
    });
});
</script>
{% endblock %}
